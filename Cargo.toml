[package]
name = "doorbell"
version = "0.1.0"
description = "Keeps a desktop app to one running copy, and hands what a second copy was started with, such as files to open, to the first."
readme = "README.md"
repository = "https://github.com/accessware/doorbell"
keywords = ["single-instance", "desktop", "ipc", "command-line"]
categories = ["gui", "os"]
license = "MIT"
edition = "2024"
# File locking, which tells a running copy apart from one that crashed.
rust-version = "1.89"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_UI_WindowsAndMessaging"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
